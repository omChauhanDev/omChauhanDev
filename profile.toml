# Everything on the profile that someone writes by hand lives here.
# scripts/build.py adds the live numbers and redraws the images in assets/.

user = "omChauhanDev"

# The opening sentence. The first part is set in full colour, the rest in grey.
statement = ["I build low-latency infrastructure for real-time AI", "and harden the open-source frameworks it runs on."]

# Merged PRs in these repositories are left out of every count.
exclude_repos = ["c4coderandcreator/Flavour-Fusion", "yash19sinha/coffee-bean"]

# The cards, two to a row, in reading order. Cards in the same row need the same size.
